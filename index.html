<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>120a — our little food calendar</title>
  <style>
    :root{--ink:#26262a;--muted:#85858b;--cream:#f1f1f3;--paper:#fcfcfd;--coral:#77777f;--yellow:#d9d9df;--line:#ddddE2;--green:#5d5d65}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:32px 28px 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:900;font-size:28px;letter-spacing:-1.8px}.brand span{color:var(--ink)}.brand:after{content:' ♡';font-size:20px;color:var(--muted)}.nav{display:flex;gap:22px;color:var(--muted);font-size:13px}.nav b{color:var(--ink)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;padding:44px 0 30px}.eyebrow{text-transform:uppercase;letter-spacing:2.2px;font-size:11px;color:var(--muted);font-weight:800}.hero h1{font-family:Georgia,serif;font-size:clamp(44px,6vw,78px);line-height:.98;letter-spacing:-4px;max-width:650px;margin:14px 0}.hero h1 em{font-style:normal;color:#77777f}.hero p{font-family:Georgia,serif;font-size:19px;line-height:1.45;color:#6f6f75;max-width:560px}.mark{align-self:center;background:var(--yellow);border:2px solid #c4c4ca;border-radius:46% 54% 52% 48%;height:220px;width:220px;display:grid;place-items:center;transform:rotate(8deg);justify-self:end;box-shadow:10px 12px 0 rgba(38,38,42,.08)}.mark:before{content:'✦';position:absolute;top:35px;right:42px;font-size:18px}.mark strong{font-family:Georgia,serif;font-size:74px;letter-spacing:-7px}.mark small{display:block;text-align:center;font-weight:800;font-size:12px;letter-spacing:1.5px}.toolbar{display:flex;justify-content:space-between;align-items:end;margin:18px 0 14px}.toolbar h2{font-family:Georgia,serif;font-size:30px;margin:0}.filters{display:flex;gap:8px}.pill{border:1px solid var(--line);border-radius:99px;background:transparent;padding:8px 13px;color:var(--muted);font-size:12px}.pill.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px #26262a14}.photo{height:210px;background:#d6d6da;position:relative;overflow:hidden;filter:grayscale(72%)}.photo img{width:100%;height:100%;object-fit:cover}.photo .number{position:absolute;top:12px;left:12px;background:#fcfcfddd;border-radius:999px;padding:5px 8px;font-weight:900;font-size:12px}.tag{position:absolute;right:12px;top:12px;background:var(--green);color:white;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800;letter-spacing:.7px}.body{padding:17px}.date{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.body h3{font-family:Georgia,serif;font-size:23px;margin:8px 0 4px;letter-spacing:-.5px}.place{font-size:13px;color:var(--muted)}.score{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:16px;padding-top:13px}.score small{color:var(--muted);font-size:11px}.score strong{font-size:22px;color:var(--ink)}.footer{display:flex;justify-content:space-between;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.add{position:fixed;right:28px;bottom:28px;background:var(--ink);color:white;border:0;border-radius:999px;padding:15px 20px;font-weight:800;box-shadow:0 8px 24px #26262a33;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#26262a99;place-items:center;padding:20px}.modal.open{display:grid}.dialog{background:var(--paper);border-radius:24px;padding:26px;width:min(500px,100%)}.dialog h2{font-family:Georgia,serif;margin:0 0 18px;font-size:30px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:white;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{border:0;border-radius:999px;padding:11px 15px;cursor:pointer}.save{background:var(--ink);color:#fff}.cancel{background:var(--cream)}@media(max-width:760px){.shell{padding:22px 17px}.hero{grid-template-columns:1fr}.mark{justify-self:start;height:130px;width:130px}.mark strong{font-size:46px}.grid{grid-template-columns:1fr}.nav{gap:10px}.filters{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">1<span>2</span>0a</div><nav class="nav"><b>Calendar</b><span>Rankings</span><span>Recipes</span><span>Us</span></nav></header>
    <section class="hero"><div><div class="eyebrow">alison + jia</div><h1>Eat something.<br><em>Remember it.</em></h1></div><div class="mark"><div><strong>120</strong><small>little bites</small></div></div></section>
    <section class="toolbar"><div><div class="eyebrow">October 2026</div><h2>Recent doors</h2></div><div class="filters"><button class="pill active" data-filter="all">All</button><button class="pill" data-filter="restaurant">Out</button><button class="pill" data-filter="recipe">Recipes</button></div></section>
    <section class="grid" id="grid"></section>
    <footer class="footer"><span>Made for two hungry people.</span><span>120a / private archive</span></footer>
  </main>
  <button class="add" id="add">＋ Add a door</button>
  <div class="modal" id="modal"><div class="dialog"><h2>Open a new door</h2><form id="form"><div class="field"><label>Dish or recipe</label><input name="title" required placeholder="e.g. Miso butter noodles" /></div><div class="field"><label>Date</label><input name="date" type="date" required /></div><div class="field"><label>Type</label><select name="type"><option value="restaurant">Out</option><option value="recipe">Recipe</option></select></div><div class="field"><label>Photo</label><input name="photo" type="file" accept="image/*" /></div><div class="field"><label>Ranking · 1–10</label><input name="score" type="number" min="1" max="10" step=".1" value="8.5" /></div><div class="actions"><button type="button" class="cancel" id="cancel">Cancel</button><button class="save">Save door</button></div></form></div></div>
  <script>
    const fallback=[{title:'Spicy dan dan noodles',place:'Bao Bei · Chinatown',date:'2026-10-01',type:'restaurant',score:9.2,img:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=80'},{title:'Brown butter apple cake',place:'Jia’s kitchen',date:'2026-09-29',type:'recipe',score:8.7,img:'https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=900&q=80'},{title:'Little gem caesar',place:'Nightingale',date:'2026-09-26',type:'restaurant',score:8.4,img:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80'},{title:'Tonkotsu ramen',place:'Danbo · Robson',date:'2026-09-22',type:'restaurant',score:9.0,img:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=80'},{title:'Peach galette',place:'Alison’s kitchen',date:'2026-09-18',type:'recipe',score:9.4,img:'https://images.unsplash.com/photo-1535920527002-b35e96722eb1?auto=format&fit=crop&w=900&q=80'},{title:'Crispy rice salad',place:'Published recipe',date:'2026-09-12',type:'recipe',score:8.1,img:'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=900&q=80'}];
    let entries=JSON.parse(localStorage.getItem('120a-entries')||'null')||fallback; const grid=document.querySelector('#grid');
    function render(filter='all'){grid.innerHTML=entries.filter(x=>filter==='all'||x.type===filter).map((x,i)=>`<article class="card"><div class="photo"><img src="${x.img}" alt="${x.title}"/><span class="number">${String(i+1).padStart(2,'0')}</span><span class="tag">${x.type==='recipe'?'RECIPE':'OUT'}</span></div><div class="body"><div class="date">${new Date(x.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div><h3>${x.title}</h3><div class="score"><small>our score</small><strong>${Number(x.score).toFixed(1)} <span style="font-size:14px">/ 10</span></strong></div></div></article>`).join('')}
    render(); document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});
    const modal=document.querySelector('#modal'); document.querySelector('#add').onclick=()=>modal.classList.add('open'); document.querySelector('#cancel').onclick=()=>modal.classList.remove('open');
    document.querySelector('#form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target), file=f.get('photo'); const save=src=>{entries.unshift({title:f.get('title'),place:f.get('place'),date:f.get('date'),type:f.get('type'),score:f.get('score'),img:src||'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80'});localStorage.setItem('120a-entries',JSON.stringify(entries));render();modal.classList.remove('open');e.target.reset()}; if(file&&file.size){const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(file)}else save()};
  </script>
</body></html>
